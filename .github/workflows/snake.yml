name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p dist/profile-summary-card-output

      # Step 1: Generate Profile Summary Cards
      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: tanzilhasan5
          BRANCH_NAME: output
          UTC_OFFSET: 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Generate Snake Contribution Animation
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tanzilhasan5
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Step 3: Checkout the output branch and merge everything
      - name: Checkout output branch
        run: |
          git fetch origin output || true
          git checkout output || git checkout -b output
          
      - name: Copy snake files to output branch
        run: |
          cp dist/github-snake.svg . 2>/dev/null || true
          cp dist/github-snake-dark.svg . 2>/dev/null || true
          
      - name: Commit and push snake files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg
          git diff --staged --quiet || git commit -m "Update snake animation"
          git push origin output
